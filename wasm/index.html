<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanta Playground</title>
<style>
  :root{ --bg:#0e1020; --panel:#161a30; --line:#262c4a; --ink:#e6e9f5; --dim:#8a93b8; --mint:#7cf0c8; --gold:#ffd479; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column}
  header{padding:18px 24px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:22px;color:var(--mint)} .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);min-height:0}
  .pane{background:var(--bg);display:flex;flex-direction:column;min-height:0}
  .label{padding:8px 16px;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
  textarea{flex:1;background:transparent;color:var(--ink);border:0;outline:0;padding:16px;resize:none;font:15px/1.6 ui-monospace,Menlo,monospace;tab-size:4}
  pre{flex:1;margin:0;padding:16px;overflow:auto;color:var(--mint);white-space:pre-wrap;line-height:1.6}
  footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px}
  button{background:var(--mint);color:#06251c;border:0;border-radius:8px;padding:10px 22px;font:600 15px ui-monospace,Menlo,monospace;cursor:pointer}
  button:disabled{opacity:.5;cursor:default} .hint{color:var(--dim);font-size:13px}
  kbd{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
</style></head>
<body>
  <header><h1>Vanta Playground</h1><div class="sub">Plain-English Vanta, compiled to WebAssembly — runs entirely in your browser, no server, no Python.</div></header>
  <div class="wrap">
    <div class="pane"><div class="label">program.va</div>
      <textarea id="code" spellcheck="false">to fib(n)
    if n is under 2
        give back n
    end
    give back fib(n - 1) + fib(n - 2)
end

let who be {"name": "Vanta", "runs_in": "the browser"}
say who["name"] + " runs in " + who["runs_in"] + "!"
say "fib(20) = " + text(fib(20))

let xs be [5, 3, 8, 1, 9, 2]
say "sorted: " + text(sort(xs))
</textarea></div>
    <div class="pane"><div class="label">output</div><pre id="out">Press Run ▶</pre></div>
  </div>
  <footer>
    <button id="run">▶ Run</button>
    <span class="hint">or press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> · running native Vanta in WASM</span>
  </footer>
  <script src="vanta.js"></script>
  <script>
    const out = document.getElementById('out'), btn = document.getElementById('run'), code = document.getElementById('code');
    async function run(){
      btn.disabled = true; out.textContent = '';
      try {
        const M = await VantaModule({ print: t => out.textContent += t + "\n",
                                      printErr: e => out.textContent += e + "\n" });
        M.FS.writeFile('/in.va', code.value);
        M.callMain(['/in.va']);
        if(!out.textContent.trim()) out.textContent = '(no output)';
      } catch(e){ out.textContent += "\n[error] " + e.message; }
      btn.disabled = false;
    }
    btn.onclick = run;
    code.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key==='Enter') run(); });
  </script>
</body></html>
